<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evenemang – Kvitt</title>
<!--#wps-include fragment="site-styles" -->
<style>
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--muted);text-decoration:none;margin-bottom:8px}
.bigcover{position:relative;overflow:hidden;border-radius:24px;min-height:280px;padding:32px;display:flex;flex-direction:column;justify-content:flex-end}
.bigcover .shape{position:absolute;right:-80px;top:-80px;width:340px;height:340px;border-radius:50%}
.bigcover .cat{position:relative;font-size:14px;font-weight:600;letter-spacing:2px;margin-bottom:8px}
.bigcover h1{position:relative;margin:0 0 8px;font-size:52px;line-height:1.05;max-width:760px}
.bigcover .when{position:relative;font-size:18px;font-weight:500}
.detail{display:flex;flex-wrap:wrap;gap:32px;margin-top:32px;align-items:flex-start}
.detail .main{flex:999 1 520px;min-width:0}
.detail aside{flex:1 1 300px;max-width:100%}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.pill{font-size:14px;font-weight:500;padding:8px 14px;background:var(--surface);border-radius:18px}
.rules{list-style:none;margin:0 0 32px;padding:0;display:flex;flex-direction:column;gap:10px}
.rules li{padding:14px 16px;background:var(--surface);border-radius:12px;color:#D2D1D8}
.rules strong{color:var(--text)}
.map{flex:1 1 240px;min-height:140px;border-radius:16px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.map i{position:absolute;display:block;background:var(--line)}
@media (max-width:600px){.bigcover h1{font-size:36px}.bigcover{padding:24px}}
</style>
</head>
<body>
<!--#wps-include fragment="site-header" -->
<main>
<div class="wrap">
<div id="status" aria-live="polite"><h1 class="muted" style="font-size:20px">Hämtar evenemanget</h1></div>
<div id="event"></div>
</div>
</main>
<!--#wps-include fragment="site-footer" -->
<script src="/kvitt.js"></script>
<script>
(function () {
  var K = window.Kvitt;
  var slug = new URLSearchParams(location.search).get('s') || '';
  var elEvent = document.getElementById('event');
  var elStatus = document.getElementById('status');

  function notFound(text) {
    elStatus.innerHTML = '<div class="panel"><h1 style="margin:0 0 8px;font-size:32px">' + K.esc(text) + '</h1><p class="muted" style="margin:0 0 16px">Gå tillbaka och välj ett annat evenemang.</p><a class="btn" href="/">Visa alla evenemang</a></div>';
  }

  function render(e) {
    var i = K.info(e.starts_at), free = e.price_sek === 0;
    var bg = K.color(e.bg, '#17171D'), ink = K.color(e.ink, '#F4F3EF'), shape = K.color(e.shape, '#C6F432');
    var saved = K.getSaved().indexOf(e.slug) !== -1;
    document.title = e.title + ' – Kvitt';
    elStatus.innerHTML = '';
    var h = '';
    h += '<a class="back" href="/">← Alla evenemang</a>';
    h += '<div class="bigcover" style="background:' + bg + ';color:' + ink + '"><span class="shape" style="background:' + shape + '"></span>' +
      '<div class="cat">' + K.esc(e.category.toUpperCase()) + '</div>' +
      '<h1>' + K.esc(e.title) + '</h1>' +
      '<div class="when">' + K.esc(K.when(i)) + ' · ' + K.esc(e.venue || '') + '</div></div>';
    h += '<div class="detail"><div class="main">';
    h += '<div class="pills"><span class="pill">' + K.esc(e.age_limit || 'Alla åldrar') + '</span><span class="pill">' + K.esc(K.pricePlain(e)) + '</span>' + (e.is_example ? '<span class="pill">Exempelevenemang</span>' : '') + '</div>';
    h += '<h2 style="margin:0 0 12px;font-size:24px">Om evenemanget</h2>';
    h += '<p style="margin:0 0 32px;font-size:17px;line-height:1.6;color:#D2D1D8">' + K.esc(e.description || '') + '</p>';
    h += '<h2 style="margin:0 0 12px;font-size:24px">Plats</h2>';
    h += '<div style="display:flex;flex-wrap:wrap;gap:16px;margin-bottom:32px"><div class="map" role="img" aria-label="Kartskiss"><i style="left:0;right:0;top:46%;height:10px"></i><i style="top:0;bottom:0;left:38%;width:10px"></i><i style="left:38%;top:46%;width:22px;height:22px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)"></i></div>' +
      '<div style="flex:1 1 240px;display:flex;flex-direction:column;justify-content:center;gap:4px"><div style="font-size:18px;font-weight:600">' + K.esc(e.venue || '') + '</div><div class="muted">' + K.esc(e.area || '') + '</div>' +
      (e.doors ? '<div class="muted">Dörrar öppnas ' + K.esc(e.doors) + '</div>' : '') + '</div></div>';
    h += '<h2 style="margin:0 0 12px;font-size:24px">Bra att veta</h2><ul class="rules">' +
      '<li><strong>Åldersgräns:</strong> ' + K.esc(e.age_limit || 'Alla åldrar') + '. Legitimation kan krävas.</li>' +
      (free ? '<li><strong>Anmälan:</strong> Gratis. Anmäl intresse så vet arrangören att du vill komma.</li>' :
        '<li><strong>Biljetter:</strong> Köp av biljetter i Kvitt öppnar snart. Anmäl intresse så hör vi av oss.</li>') +
      '</ul>';
    if (!free) {
      h += '<div class="panel"><h2 style="margin:0 0 8px;font-size:20px">Kan du inte gå? Kommer snart</h2>' +
        '<p class="muted" style="margin:0">När biljettköp öppnar kan du sälja din biljett vidare till högst originalpriset. Din QR-kod slutar då gälla och köparen får en ny, så ingen kan sälja samma biljett två gånger.</p></div>';
    }
    h += '</div>';
    h += '<aside class="panel" style="display:flex;flex-direction:column;gap:14px">' +
      '<div class="muted" style="font-size:14px">' + (free ? 'Gratis evenemang' : 'Biljett från') + '</div>' +
      '<div style="font-family:\'Space Grotesk\',sans-serif;font-weight:700;font-size:36px">' + K.esc(K.pricePlain(e)) + '</div>' +
      '<form id="interest" novalidate>' +
      '<div class="field"><label for="n">Ditt namn</label><input id="n" class="input" type="text" autocomplete="name" required maxlength="100"></div>' +
      '<div class="field"><label for="m">E-post</label><input id="m" class="input" type="email" autocomplete="email" required maxlength="200"></div>' +
      '<div class="hp" aria-hidden="true"><label>Lämna tomt<input id="w" type="text" tabindex="-1" autocomplete="off"></label></div>' +
      '<button class="btn" id="go" type="submit" style="width:100%">' + (free ? 'Anmäl dig' : 'Anmäl intresse för biljett') + '</button>' +
      '<p class="muted" style="font-size:13px;margin:10px 0 0">Vi sparar ditt namn och din e-post för den här anmälan. Läs mer i <a href="/villkor.html">villkoren</a>.</p>' +
      '<div id="res" role="status" aria-live="polite"></div></form>' +
      '<button type="button" id="save" class="btn ghost" aria-pressed="' + saved + '" style="width:100%">' + (saved ? 'Sparad ✓' : 'Spara till senare') + '</button>' +
      '</aside></div>';
    elEvent.innerHTML = h;

    document.getElementById('save').addEventListener('click', function () {
      var now = K.toggleSaved(e.slug);
      this.setAttribute('aria-pressed', String(now));
      this.textContent = now ? 'Sparad ✓' : 'Spara till senare';
    });

    document.getElementById('interest').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var res = document.getElementById('res');
      var name = document.getElementById('n').value.trim();
      var mail = document.getElementById('m').value.trim();
      if (name.length < 2 || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) {
        res.innerHTML = '<div class="msg err">Fyll i ditt namn och en giltig e-postadress.</div>';
        return;
      }
      if (document.getElementById('w').value) { res.innerHTML = '<div class="msg ok">Tack! Din anmälan är mottagen.</div>'; return; }
      var btn = document.getElementById('go');
      btn.disabled = true;
      K.insert('event_interests', { event_slug: e.slug, kind: free ? 'rsvp' : 'ticket-interest', name: name, email: mail })
        .then(function () {
          res.innerHTML = '<div class="msg ok">Tack ' + K.esc(name) + '! Din anmälan är mottagen.</div>';
          document.getElementById('n').value = ''; document.getElementById('m').value = '';
        })
        .catch(function () {
          btn.disabled = false;
          res.innerHTML = '<div class="msg err">Något gick fel. Försök igen om en stund.</div>';
        });
    });
  }

  if (!/^[a-z0-9-]{3,120}$/.test(slug)) { notFound('Hittade inte evenemanget'); return; }
  K.get('events?slug=eq.' + encodeURIComponent(slug) + '&select=*&limit=1')
    .then(function (rows) { if (rows.length) { render(rows[0]); } else { notFound('Hittade inte evenemanget'); } })
    .catch(function () { notFound('Kunde inte hämta evenemanget'); });
})();
</script>
</body>
</html>
